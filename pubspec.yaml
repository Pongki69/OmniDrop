name: omni_drop
description: Private, resumable peer-to-peer file transfer.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.4
  path_provider: ^2.1.5
  file_picker: ^13.3.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.5
  desktop_drop: ^0.8.0
  bonsoir: ^7.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/omnidrop_logo.png
